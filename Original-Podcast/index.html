    <style>
      html.password-locked,
      html.password-locked body {
        overflow: hidden;
      }
      #passwordGate {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 35%, rgba(217, 86, 59, .16), transparent 55%),
          #171717;
        font-family: Arial, sans-serif;
        opacity: 1;
        transition: opacity .65s ease;
      }
      #passwordGate .password-card {
        width: min(100%, 390px);
        padding: 38px 30px;
        border: 1px solid rgba(217, 86, 59, .38);
        border-radius: 18px;
        background: rgba(39, 34, 33, .96);
        box-shadow: 0 18px 60px rgba(0, 0, 0, .5);
        text-align: center;
        transition: border-color .35s ease, box-shadow .35s ease;
      }
      #passwordGate h1 {
        margin: 0 0 10px;
        color: #fff;
        font-size: 27px;
      }
      #passwordGate p {
        margin: 0 0 24px;
        color: #bbb;
        font-size: 14px;
      }
      #passwordGate .password-input-wrap {
        position: relative;
      }
      #podcastPassword {
        display: block;
        width: 100%;
        height: 48px;
        padding: 0 48px 0 14px;
        border: 1px solid #65504b;
        border-radius: 9px;
        outline: none;
        background: #171717;
        color: #fff;
        text-align: center;
        font-size: 16px;
      }
      #podcastPassword:focus {
        border-color: #d9563b;
        box-shadow: 0 0 0 3px rgba(217, 86, 59, .15);
      }
      #passwordVisibility {
        position: absolute;
        top: 5px;
        right: 5px;
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #aaa;
        cursor: pointer;
      }
      #passwordVisibility:hover {
        color: #fff;
      }
      #passwordVisibility .material-symbols-rounded { font-size: 21px; }
      #passwordSubmit {
        width: 100%;
        height: 46px;
        margin-top: 14px;
        border: 0;
        border-radius: 9px;
        background: #d9563b;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: filter .2s ease, transform .2s ease, background .3s ease;
      }
      #passwordSubmit:hover {
        filter: brightness(1.12);
        transform: translateY(-1px);
      }
      #passwordSubmit:disabled { cursor: default; }
      #passwordError {
        min-height: 18px;
        margin-top: 13px;
        color: #ff8d78;
        font-size: 13px;
      }
      #passwordGate.is-success .password-card {
        border-color: rgba(112,208,151,.75);
        box-shadow: 0 0 35px rgba(112,208,151,.16), 0 18px 60px rgba(0,0,0,.45);
      }
      #passwordGate.is-success #passwordSubmit {
        background: #31865a;
      }
      #passwordGate.is-exiting {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #passwordGate, #passwordGate * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
    <script>
      try {
        if (sessionStorage.getItem("ogPodcastAccess") === "granted") {
          document.documentElement.classList.remove("password-locked");
        } else {
          document.documentElement.classList.add("password-locked");
        }
      } catch (error) {
        document.documentElement.classList.add("password-locked");
      }

    <script>
      (function () {
        const form = document.getElementById("passwordForm");
        const input = document.getElementById("podcastPassword");
        const error = document.getElementById("passwordError");
        const gate = document.getElementById("passwordGate");
        const visibility = document.getElementById("passwordVisibility");
        const submit = document.getElementById("passwordSubmit");

        if (!document.documentElement.classList.contains("password-locked")) {
          gate.remove();
          return;
        }

        visibility.addEventListener("click", function () {
          const showing = input.type === "password";
          input.type = showing ? "text" : "password";
          visibility.setAttribute("aria-label", showing ? "Hide password" : "Show password");
          visibility.setAttribute("aria-pressed", String(showing));
          visibility.querySelector(".material-symbols-rounded").textContent = showing ? "visibility_off" : "visibility";
          input.focus();
        });

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          if (input.value === "Only4Tns") {
            submit.disabled = true;
            submit.textContent = "Access granted";
            gate.classList.add("is-success");
            error.textContent = "";
            try {
              sessionStorage.setItem("ogPodcastAccess", "granted");
            } catch (storageError) {
              // Access remains available for this page load if storage is unavailable.
            }
            window.setTimeout(function () {
              gate.classList.add("is-exiting");
              window.setTimeout(function () {
                document.documentElement.classList.remove("password-locked");
                gate.remove();
              }, 650);
            }, 550);
          } else {
            error.textContent = "Incorrect code. Please try again.";
            input.value = "";
            input.focus();
          }
        });
      })();
    </script>
