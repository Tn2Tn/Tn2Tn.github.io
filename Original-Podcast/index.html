    <style>
html.password-locked,html.password-locked body{overflow:hidden}
#passwordGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.48);font-family:Arial,sans-serif;opacity:1;transition:opacity .65s ease}
#passwordGate .password-card{position:relative;width:min(100%,440px);padding:38px 30px 30px;border:0;border-radius:15px;background:#272524;box-shadow:inset #000000 0px 0px 12px 0px;text-align:center;transition:box-shadow .35s ease}
#passwordGate h1{margin:0 0 10px;color:#fff;font-size:28px;font-weight:800}
#passwordGate p{margin:0 0 24px;color:#d0c4c1;font-size:15px}
#passwordGate .password-input-wrap{position:relative}
#podcastPassword{display:block;width:100%;height:49px;padding:0 48px 0 14px;border:1px solid rgba(0,0,0,.55);border-radius:9px;outline:none;background:rgba(0,0,0,.3);color:#fff;text-align:center;font-size:16px}
#podcastPassword:focus{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(0,0,0,.2)}
#passwordVisibility{position:absolute;top:5px;right:5px;display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:7px;background:transparent;color:#c9b9b5;cursor:pointer}
#passwordVisibility:hover{color:#fff;background:rgba(0,0,0,.2)}
#passwordVisibility .material-symbols-rounded{font-size:21px}
#passwordSubmit{width:100%;height:47px;margin-top:14px;border:1px solid rgba(0,0,0,.35);border-radius:9px;background:rgba(0,0,0,.38);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:inset #000000 0px 0px 8px 0px;transition:filter .2s ease,transform .2s ease,background .3s ease,box-shadow .3s ease}
#passwordSubmit:hover{background:rgba(0,0,0,.52);transform:translateY(-1px)}
#passwordSubmit:disabled{cursor:default}
#passwordError{min-height:18px;margin-top:13px;color:#ffad9b;font-size:13px}
#passwordGate.is-success .password-card{box-shadow:inset #000000 0px 0px 12px 0px,0 0 0 2px rgba(112,208,151,.5);animation:gateSuccessPulse .55s ease}
#passwordGate.is-success #passwordSubmit{background:rgba(37,105,67,.8)}
#passwordGate.is-exiting{opacity:0;pointer-events:none}
#passwordGate.is-exiting .password-card{animation:gateExit .65s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes gateSuccessPulse{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes gateExit{to{transform:translateY(-18px) scale(.88);opacity:0;filter:blur(8px)}}
@media(max-width:480px){#passwordGate .password-card{padding:32px 22px 24px}#passwordGate h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){#passwordGate,#passwordGate *{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
    <script>
      try {

    <script>
      (function () {
        const form = document.getElementById("passwordForm");
        const input = document.getElementById("podcastPassword");
        const error = document.getElementById("passwordError");
        const gate = document.getElementById("passwordGate");
        const visibility = document.getElementById("passwordVisibility");
        const submit = document.getElementById("passwordSubmit");

        if (!document.documentElement.classList.contains("password-locked")) {
          gate.remove();
          return;
        }

        visibility.addEventListener("click", function () {
          const showing = input.type === "password";
          input.type = showing ? "text" : "password";
          visibility.setAttribute("aria-label", showing ? "Hide password" : "Show password");
          visibility.setAttribute("aria-pressed", String(showing));
          visibility.querySelector(".material-symbols-rounded").textContent = showing ? "visibility_off" : "visibility";
          input.focus();
        });

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          if (input.value === "Only4Tns") {
            submit.disabled = true;
            submit.textContent = "Access granted";
            gate.classList.add("is-success");
            error.textContent = "";
            try {
              sessionStorage.setItem("ogPodcastAccess", "granted");
            } catch (storageError) {
              // Access remains available for this page load if storage is unavailable.
            }
            window.setTimeout(function () {
              gate.classList.add("is-exiting");
              window.setTimeout(function () {
                document.documentElement.classList.remove("password-locked");
                gate.remove();
              }, 650);
            }, 550);
          } else {
            error.textContent = "Incorrect code. Please try again.";
            input.value = "";
            input.focus();
          }
        });
      })();
    </script>
