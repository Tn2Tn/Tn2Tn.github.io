<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Admin | Tn 2 Tn</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #222; color: #fff; font-family: Arial, sans-serif; }
    main { width: min(560px, 100%); padding: 32px; border: 1px solid #46515c; border-radius: 16px; background: #31343c; text-align: center; }
    h1 { color: #9fc5e8; margin-top: 0; }
    p { line-height: 1.6; color: #d5dbe0; overflow-wrap: anywhere; }
    button { padding: 12px 20px; border: 0; border-radius: 8px; background: #234970; color: white; cursor: pointer; font-size: 15px; }
    button:disabled { opacity: .6; cursor: wait; }
    #signout { margin-top: 12px; }
    a { color: #9fc5e8; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <h1>Owner Admin</h1>
    <p id="status" role="status" aria-live="polite">Checking owner access…</p>
    <button id="signout" type="button" hidden>Sign out</button>
    <p><a href="/">Back to homepage</a></p>
  </main>
  <script>
    const OWNER_EMAIL = "tn2tnpodcast@gmail.com";
    const status = document.getElementById("status");
    const signout = document.getElementById("signout");

    // Save the OAuth response and immediately remove credentials from the address bar.
    const callbackParams = new URLSearchParams(window.location.hash.slice(1));
    const callbackAccessToken = callbackParams.get("access_token");
    const callbackRefreshToken = callbackParams.get("refresh_token");
    if (window.location.hash) {
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
    }

    function withTimeout(promise, label, milliseconds = 15000) {
      let timer;
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timer = window.setTimeout(() => reject(new Error(label + " timed out. Please reload and try again.")), milliseconds);
        })
      ]).finally(() => window.clearTimeout(timer));
    }

    async function checkOwner() {
      try {
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
          throw new Error("The sign-in service did not load. Check your connection and reload this page.");
        }

        const client = window.supabase.createClient(
          "https://lnjeyqwteautkvwrkgbe.supabase.co",
          "sb_publishable_T0lmc-JHGB-h9MXAVFEukQ_-oJ3NEpE",
          {
            auth: {
              flowType: "implicit",
              detectSessionInUrl: false,
              persistSession: true,
              autoRefreshToken: true
            }
          }
        );

        signout.hidden = false;
        signout.addEventListener("click", async () => {
          signout.disabled = true;
          status.textContent = "Signing out…";
          try {
            const { error } = await withTimeout(client.auth.signOut(), "Sign out");
            if (error) throw error;
            window.location.replace("/");
          } catch (error) {
            status.textContent = "Could not sign out: " + (error.message || "Please try again.");
            signout.disabled = false;
          }
        });

        if (callbackAccessToken && callbackRefreshToken) {
          status.textContent = "Finishing Google sign-in…";
          const { error } = await withTimeout(
            client.auth.setSession({
              access_token: callbackAccessToken,
              refresh_token: callbackRefreshToken
            }),
            "Google sign-in"
          );
          if (error) throw error;
        }

        status.textContent = "Verifying owner account…";
        const sessionResult = await withTimeout(client.auth.getSession(), "Session check");
        if (sessionResult.error) throw sessionResult.error;

        if (!sessionResult.data.session) {
          status.textContent = "No active sign-in found. Return to the homepage, type admin, and sign in again.";
          return;
        }

        const userResult = await withTimeout(client.auth.getUser(), "Owner verification");
        if (userResult.error) throw userResult.error;

        const user = userResult.data.user;
        if (!user || (user.email || "").toLowerCase() !== OWNER_EMAIL) {
          await withTimeout(client.auth.signOut(), "Sign out");
          status.textContent = "Access denied. This Google account is not authorised.";
          return;
        }

        status.textContent = "Signed in as " + user.email + ". Owner access verified.";
      } catch (error) {
        status.textContent = "Could not verify owner access: " + (error.message || "Unknown error. Please reload and try again.");
      }
    }

    checkOwner();
  </script>
</body>
</html>
