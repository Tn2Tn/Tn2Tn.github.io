<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#222222">
  <meta name="description" content="Explore Hashkafa and Halocho from Tn2Tn Network. Browse the LL section and its audio shorts.">
  <link rel="canonical" href="https://tn2tn.github.io/LL/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hashkafa &amp; Halocho | Tn2Tn Network">
  <meta property="og:description" content="Hashkafa and Halocho audio shorts from Tn2Tn Network.">

  <title>LL | Tn²</title>

  <link rel="icon" href="../Tn%202%20Tn.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,-25" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../visitor-tracker.js?v=7"></script>
</head>

<body>

  <!-- HEADER -->
  <div class="top-bar-wrap">
    <header class="site-header">

      <a class="brand" href="https://tn2tn.github.io/" aria-label="Tn² Home">
        <img
          id="siteLogo"
          src="../Tn 2 Tn.png"
          alt="Tn² Logo"
        >
      </a>

      <button
        class="quote-trigger"
        id="quoteTrigger"
        type="button"
      >
        Show Today's Quote
      </button>

      <a
        class="home-link"
        href="https://tn2tn.github.io/"
        aria-label="Home"
        title="Home"
      >
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
      </a>

    </header>
  </div>

  <div class="top-fade" aria-hidden="true"></div>


  <!-- LEFT EQUALIZER -->
  <aside class="eq-sidebar eq-left" id="eqLeft" aria-hidden="true">
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>

    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
  </aside>


  <!-- RIGHT EQUALIZER -->
  <aside class="eq-sidebar eq-right" id="eqRight" aria-hidden="true">
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
  </aside>


  <main style="max-width:900px;margin:14px auto 12px;padding:0 22px;text-align:center;color:#eee;"><h1 style="font-size:2rem;margin-bottom:8px;">Hashkafa &amp; Halocho</h1><p style="line-height:1.6;color:#c7c7c7;">Explore the Hashkafa &amp; Halocho section of Tn2Tn Network and browse its audio shorts.</p></main>

  <!-- SHORTS CONTAINER -->
  <main
    class="shorts-container"
    id="shortsContainer"
    aria-label="Audio shorts"
    tabindex="0"
  ></main>


  <!-- ONE SHARED AUDIO PLAYER -->
  <audio id="audioPlayer" preload="metadata"></audio>


  <!-- DAILY QUOTE POPUP -->
  <div
    class="quote-overlay"
    id="quoteOverlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="quoteHeading"
    hidden
  >
    <div class="quote-panel">

      <div class="bg" aria-hidden="true">
        <div></div>
        <div></div>
      </div>

      <div class="header-text" aria-live="polite">
        <span id="dailyQuote"></span>
      </div>

      <!-- SVG filter for the glowing text -->
      <svg
        class="filters"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter
            id="glow-4"
            color-interpolation-filters="sRGB"
            x="-50%"
            y="-200%"
            width="200%"
            height="500%"
          >
            <feGaussianBlur
              in="SourceGraphic"
              stdDeviation="4"
              result="blur4"
            />

            <feGaussianBlur
              in="SourceGraphic"
              stdDeviation="19"
              result="blur19"
            />

            <feGaussianBlur
              in="blur4"
              result="color-blur"
              type="matrix"
              values="
                1 0 0 0 0
                0 0.98 0 0 0
                0 0 0.96 0 0
                0 0 0 0.8 0
              "
            />

            <feMerge>
              <feMergeNode in="blur19"/>
              <feMergeNode in="color-blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
      </svg>

    </div>
  </div>

  <noscript>
    JavaScript must be enabled to play the audio shorts.
  </noscript>

<script src="/admin-access.js?v=3"></script>
</body>
</html>
