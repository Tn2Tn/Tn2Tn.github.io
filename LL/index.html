    <script>
        const container = document.getElementById('shortsContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const eqLeftBars = document.querySelectorAll('#eqLeft .eq-bar');
        const eqRightBars = document.querySelectorAll('#eqRight .eq-bar');
        
        // Setup infinite loop cloning matching original cards
        const originalCards = Array.from(container.querySelectorAll('.short-card'));
        const firstClone = originalCards[0].cloneNode(true);
        const lastClone = originalCards[originalCards.length - 1].cloneNode(true);
        
        container.appendChild(firstClone);
        container.insertBefore(lastClone, originalCards[0]);

        const cards = container.querySelectorAll('.short-card');
        
        let currentCard = null;
        let currentAudioSrc = null;
        const speeds = [1, 1.25, 1.5, 1.75, 2, 16];

        // Start initial view on the first real card (index 1)
        window.addEventListener('load', () => {
            container.scrollTop = window.innerHeight;
        });

        // Infinite scroll loop repositioning logic
        container.addEventListener('scroll', () => {
            const cardHeight = window.innerHeight;
            const totalOriginals = originalCards.length;

            if (container.scrollTop >= (totalOriginals + 1) * cardHeight - 10) {
                container.style.scrollSnapType = 'none';
                container.scrollTop = cardHeight;
                setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
            } else if (container.scrollTop <= 5) {
                container.style.scrollSnapType = 'none';
                container.scrollTop = totalOriginals * cardHeight;
                setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
            }
        });

        cards.forEach(card => {
            const playBtn = card.querySelector('.play-btn');
            const speedBtn = card.querySelector('.speed-btn');
            const seekRange = card.querySelector('.player-seek');
            const rangeFill = card.querySelector('.range-fill');
            const disc = card.querySelector('.album-disc');
            const audioSrc = card.getAttribute('data-src');

            card.dataset.speedIndex = 0;

            playBtn.addEventListener('click', () => {
                if (currentAudioSrc !== audioSrc) {
                    audioPlayer.src = audioSrc;
                    currentAudioSrc = audioSrc;
                    
                    cards.forEach(c => {
                        c.querySelector('.play-btn').textContent = '▶';
                        c.querySelector('.album-disc').classList.remove('playing');
                    });
                }

                if (audioPlayer.paused) {
                    audioPlayer.play();
                    playBtn.textContent = '⏸';
                    disc.classList.add('playing');
                    currentCard = card;

                    let speedIdx = parseInt(card.dataset.speedIndex);
                    audioPlayer.playbackRate = speeds[speedIdx];
                } else {
                    audioPlayer.pause();
                    playBtn.textContent = '▶';
                    disc.classList.remove('playing');
                }
            });

            speedBtn.addEventListener('click', () => {
                let speedIdx = parseInt(card.dataset.speedIndex);
                speedIdx = (speedIdx + 1) % speeds.length;
                card.dataset.speedIndex = speedIdx;
                
                const selectedSpeed = speeds[speedIdx];
                audioPlayer.playbackRate = selectedSpeed;
                speedBtn.textContent = selectedSpeed + "x";
                speedBtn.style.color = selectedSpeed === 1 ? "#fff" : "#d800ff";

                if (currentCard === card && !audioPlayer.paused) {
                    audioPlayer.playbackRate = selectedSpeed;
                }
            });

            seekRange.addEventListener('input', () => {
                if (currentAudioSrc === audioSrc && audioPlayer.duration) {
                    audioPlayer.currentTime = (seekRange.value / 100) * audioPlayer.duration;
                }
            });
        });

        audioPlayer.addEventListener('timeupdate', () => {
            if (currentCard && audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                const rangeFill = currentCard.querySelector('.range-fill');
                const seekRange = currentCard.querySelector('.player-seek');
                rangeFill.style.width = percent + '%';
                seekRange.value = percent;
            }
        });

        // Loop functionality: Restart current audio clip when it ends
        audioPlayer.addEventListener('ended', () => {
            if (currentCard) {
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            }
        });

        // Equalizer animation loop
        function animateEQ() {
            if (!audioPlayer.paused) {
                eqLeftBars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 55) + 10;
                    bar.style.height = randomHeight + 'px';
                });
                eqRightBars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 55) + 10;
                    bar.style.height = randomHeight + 'px';
                });
            } else {
                eqLeftBars.forEach(bar => bar.style.height = '8px');
                eqRightBars.forEach(bar => bar.style.height = '8px');
            }
            requestAnimationFrame(animateEQ);
        }
        requestAnimationFrame(animateEQ);

        let observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.dataset.speedIndex = 0;
                    const speedBtn = entry.target.querySelector('.speed-btn');
                    speedBtn.textContent = "1x";
                    speedBtn.style.color = "#fff";

                    if (currentCard === entry.target && !audioPlayer.paused) {
                        audioPlayer.playbackRate = 1;
                    }
                } else {
                    const cardAudioSrc = entry.target.getAttribute('data-src');
                    if (currentAudioSrc === cardAudioSrc && !audioPlayer.paused) {
                        audioPlayer.pause();
                        entry.target.querySelector('.play-btn').textContent = '▶';
                        entry.target.querySelector('.album-disc').classList.remove('playing');
                    }
                }
            });
        }, { root: container, threshold: 0.6 });

        cards.forEach(card => observer.observe(card));
    </script>
