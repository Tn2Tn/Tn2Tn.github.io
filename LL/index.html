<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Shorts - Tn 2 Tn Network</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Back to Main Site Button */
        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }
        .back-home:hover {
            background: rgba(0, 255, 204, 0.1);
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        /* Vertical Scrolling Container */
        .shorts-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Hide scrollbar for Firefox */
        }
        .shorts-container::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome, Safari, Edge */
        }

        /* Individual Short Card */
        .short-card {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 20px;
            background: linear-gradient(135deg, #181824, #121212);
        }

        /* Rotating Image Vinyl Art */
        .audio-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        .album-disc {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 6px solid #1a1a1a;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(0, 255, 204, 0.15);
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }
        .album-disc.playing {
            animation-play-state: running;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 35px rgba(0, 255, 204, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Content Overlay (Title, Description, Player Controls) */
        .short-content {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(12px);
            padding: 22px;
            border-radius: 18px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .audio-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .audio-desc {
            font-size: 0.9rem;
            color: #b0b0b0;
            margin-bottom: 16px;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Neon Styled Play Button */
        .play-btn {
            background: linear-gradient(135deg, #00ffcc, #00b386);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: #121212;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .play-btn:hover {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.7);
        }
        .play-btn:active {
            transform: scale(0.95);
        }

        /* Podcast-Style Speed Button Matching Your Script */
        .speed-btn {
            background: rgba(18, 18, 18, 0.9);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #fff;
            height: 38px;
            padding: 0 10px;
            border-radius: 19px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        .speed-btn:hover {
            background: rgba(0, 255, 204, 0.15);
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }

        .progress-bar-container {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.15);
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #00ffcc;
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 10px #00ffcc;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <a href="https://tn2tn.github.io" class="back-home">← Back to Home</a>

    <div class="shorts-container" id="shortsContainer">
        <!-- Short Item 1 -->
        <div class="short-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
            <div class="audio-art">
                <img src="logo.png" alt="Vinyl Art" class="album-disc">
            </div>
            <div class="short-content">
                <div class="audio-title">1</div>
                <div class="audio-desc">eggsample</div>
                <div class="audio-controls">
                    <button class="play-btn">▶</button>
                    <button class="speed-btn">1x</button>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Short Item 2 -->
        <div class="short-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
            <div class="audio-art">
                <img src="logo.png" alt="Vinyl Art" class="album-disc">
            </div>
            <div class="short-content">
                <div class="audio-title">2</div>
                <div class="audio-desc">eggsample 2</div>
                <div class="audio-controls">
                    <button class="play-btn">▶</button>
                    <button class="speed-btn">1x</button>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Short Item 3 -->
        <div class="short-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
            <div class="audio-art">
                <img src="logo.png" alt="Vinyl Art" class="album-disc">
            </div>
            <div class="short-content">
                <div class="audio-title">3</div>
                <div class="audio-desc">eggsample 3.</div>
                <div class="audio-controls">
                    <button class="play-btn">▶</button>
                    <button class="speed-btn">1x</button>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        const container = document.getElementById('shortsContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        
        // Get original cards and set up infinite loop cloning
        const originalCards = Array.from(container.querySelectorAll('.short-card'));
        const firstClone = originalCards[0].cloneNode(true);
        const lastClone = originalCards[originalCards.length - 1].cloneNode(true);
        
        container.appendChild(firstClone);
        container.insertBefore(lastClone, originalCards[0]);

        const cards = container.querySelectorAll('.short-card');
        
        let currentCard = null;
        let currentAudioSrc = null;
        const speeds = [1, 1.25, 1.5, 1.75, 2, 16];

        // Start initial view on the first real card (index 1)
        window.addEventListener('load', () => {
            container.scrollTop = window.innerHeight;
        });

        // Infinite scroll loop repositioning logic
        container.addEventListener('scroll', () => {
            const cardHeight = window.innerHeight;
            const totalOriginals = originalCards.length;

            if (container.scrollTop >= (totalOriginals + 1) * cardHeight - 10) {
                container.style.scrollSnapType = 'none';
                container.scrollTop = cardHeight;
                setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
            } else if (container.scrollTop <= 5) {
                container.style.scrollSnapType = 'none';
                container.scrollTop = totalOriginals * cardHeight;
                setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
            }
        });

        cards.forEach(card => {
            const playBtn = card.querySelector('.play-btn');
            const speedBtn = card.querySelector('.speed-btn');
            const progressContainer = card.querySelector('.progress-bar-container');
            const disc = card.querySelector('.album-disc');
            const audioSrc = card.getAttribute('data-src');

            card.dataset.speedIndex = 0;

            playBtn.addEventListener('click', () => {
                if (currentAudioSrc !== audioSrc) {
                    audioPlayer.src = audioSrc;
                    currentAudioSrc = audioSrc;
                    
                    cards.forEach(c => {
                        c.querySelector('.play-btn').textContent = '▶';
                        c.querySelector('.album-disc').classList.remove('playing');
                    });
                }

                if (audioPlayer.paused) {
                    audioPlayer.play();
                    playBtn.textContent = '⏸';
                    disc.classList.add('playing');
                    currentCard = card;

                    let speedIdx = parseInt(card.dataset.speedIndex);
                    audioPlayer.playbackRate = speeds[speedIdx];
                } else {
                    audioPlayer.pause();
                    playBtn.textContent = '▶';
                    disc.classList.remove('playing');
                }
            });

            speedBtn.addEventListener('click', () => {
                let speedIdx = parseInt(card.dataset.speedIndex);
                speedIdx = (speedIdx + 1) % speeds.length;
                card.dataset.speedIndex = speedIdx;
                
                const selectedSpeed = speeds[speedIdx];
                audioPlayer.playbackRate = selectedSpeed;
                speedBtn.textContent = selectedSpeed + "x";

                speedBtn.style.color = selectedSpeed === 1 ? "#fff" : "#00ffcc";

                const isMobile = window.matchMedia("(max-width: 1200px)").matches;
                if (selectedSpeed === 1 || selectedSpeed === 2) {
                    speedBtn.style.fontSize = isMobile ? "0.8rem" : "0.9rem";
                } else {
                    speedBtn.style.fontSize = isMobile ? "0.75rem" : "0.85rem";
                }

                if (currentCard === card && !audioPlayer.paused) {
                    audioPlayer.playbackRate = selectedSpeed;
                }
            });

            progressContainer.addEventListener('click', (e) => {
                if (currentAudioSrc === audioSrc && !audioPlayer.paused) {
                    const rect = progressContainer.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    audioPlayer.currentTime = (clickX / rect.width) * audioPlayer.duration;
                }
            });
        });

        audioPlayer.addEventListener('timeupdate', () => {
            if (currentCard && audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                currentCard.querySelector('.progress-bar').style.width = percent + '%';
            }
        });

        audioPlayer.addEventListener('ended', () => {
            if (currentCard) {
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            }
        });

        let observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.dataset.speedIndex = 0;
                    const speedBtn = entry.target.querySelector('.speed-btn');
                    speedBtn.textContent = "1x";
                    speedBtn.style.color = "#fff";
                    speedBtn.style.fontSize = "0.85rem";

                    if (currentCard === entry.target && !audioPlayer.paused) {
                        audioPlayer.playbackRate = 1;
                    }
                } else {
                    const cardAudioSrc = entry.target.getAttribute('data-src');
                    if (currentAudioSrc === cardAudioSrc && !audioPlayer.paused) {
                        audioPlayer.pause();
                        entry.target.querySelector('.play-btn').textContent = '▶';
                        entry.target.querySelector('.album-disc').classList.remove('playing');
                    }
                }
            });
        }, { root: container, threshold: 0.6 });

        cards.forEach(card => observer.observe(card));
    </script>
</body>
</html>
