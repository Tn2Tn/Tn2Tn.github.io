<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#222222">
  <meta name="description" content="Tn² audio shorts — listen, scroll and discover.">

  <title>LL | Tn²</title>

  <link rel="icon" href="/Tn%202%20Tn.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,-25"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <div class="top-bar-wrap">
    <header class="site-header" aria-label="Tn² navigation">

      <a
        class="brand"
        href="https://tn2tn.github.io/"
        aria-label="Tn² home"
      >
        <img
          id="siteLogo"
          src="Tn 2 Tn.png"
          alt="Tn² logo"
        >
      </a>

      <button
        class="quote-trigger"
        id="quoteTrigger"
        type="button"
      >
        <span class="material-symbols-rounded" aria-hidden="true">
          format_quote
        </span>

        <span>Show Today's Quote</span>
      </button>

      <a
        class="home-link"
        href="https://tn2tn.github.io/"
        aria-label="Home"
        title="Home"
      >
        <span class="material-symbols-rounded" aria-hidden="true">
          home
        </span>
      </a>

    </header>
  </div>

  <div class="top-fade" aria-hidden="true"></div>


  <!-- LEFT EQUALIZER -->
  <aside class="eq-sidebar eq-left" id="eqLeft" aria-hidden="true">
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
  </aside>


  <!-- RIGHT EQUALIZER -->
  <aside class="eq-sidebar eq-right" id="eqRight" aria-hidden="true">
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
  </aside>


  <!-- SHORTS CONTAINER -->
  <main
    class="shorts-container"
    id="shortsContainer"
    aria-label="Audio shorts"
  >
    <!-- Short cards are created by script.js -->
  </main>


  <!-- ONE SHARED AUDIO PLAYER -->
  <audio id="audioPlayer" preload="metadata"></audio>


  <!-- DAILY QUOTE POPUP -->
  <div
    class="quote-overlay"
    id="quoteOverlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="quoteHeading"
    hidden
  >
    <div class="quote-panel">

      <button
        class="quote-close"
        id="quoteClose"
        type="button"
        aria-label="Close quote"
      >
        ×
      </button>

      <div
        class="quote-mark material-symbols-rounded"
        aria-hidden="true"
      >
        format_quote
      </div>

      <p class="quote-kicker" id="quoteHeading">
        TODAY'S QUOTE
      </p>

      <p class="quote-text" id="dailyQuote">
        Small steps, repeated consistently, can lead to big changes.
      </p>

      <div class="quote-accent" aria-hidden="true"></div>

    </div>
  </div>


  <noscript>
    This page needs JavaScript enabled to load and play the audio shorts.
  </noscript>

</body>
</html>
